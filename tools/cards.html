<!doctype html><!-- tools/render.sh için: yigitbuyukeren.com ana sayfasındaki kartları tek başına çizer (?card=banner|aile|ride|w1..w3|w7|w8&theme=light|dark). --><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="/assets/site.css"><style>
html,body{margin:0;background:var(--bg)}
body{width:var(--w)}
.feature,.work{margin:0!important;box-shadow:none!important}
.feature .links,.work .links{display:none}
.work{height:var(--h,auto)}
.work .fact{margin-top:auto}
.feature-text{padding:44px!important}
.banner{position:relative;width:1280px;height:400px;border:1px solid var(--rule);border-radius:24px;padding:56px 64px;display:grid;grid-template-columns:1fr 250px;gap:48px;align-items:center;background:var(--bg)}
.banner h1{font-size:76px;line-height:.95;letter-spacing:-.045em;font-weight:680;margin:22px 0}
.banner h1 em{font-style:normal;color:var(--accent)}
.banner .mark{font-size:22px}.banner .mark-badge{width:40px;height:40px;border-radius:11px;font-size:16px}
.banner .sub{font:500 18px/1 var(--f-mono);color:var(--muted);letter-spacing:.02em;margin:0}
.banner .avatar{max-width:none;width:250px;border-radius:36px}
.banner .ruler{position:absolute;left:64px;right:64px;bottom:30px}
.banner .now{position:absolute;right:64px;top:40px;font:500 15px/1 var(--f-mono);color:var(--ink-2);background:none;border:0;box-shadow:none}
</style></head><body><script>
var q=new URLSearchParams(location.search),root=document.documentElement;
root.dataset.theme=q.get('theme')||'light';
document.body.style.setProperty('--w',(q.get('w')||1100)+'px');
if(q.get('h'))document.body.style.setProperty('--h',q.get('h')+'px');
var card=q.get('card');
if(card==='banner'){
  document.body.innerHTML='<div class="banner"><div><span class="mark"><span class="mark-badge">yb<i>.</i></span><span>Yiğit Eren Büyükeren</span></span><h1>Fikri alır, <em>çalışan</em><br>bir şeye çeviririm.</h1><p class="sub">Mobil uygulama · Android · Sunucu · Ağ · İstanbul</p></div><div class="avatar"><img src="/assets/img/avatar.png" alt=""></div><div class="ruler"></div></div>';
}else{
  fetch('/').then(function(r){return r.text()}).then(function(t){
    var doc=new DOMParser().parseFromString(t,'text/html');
    var sel={aile:'.feature--aile',ride:'.feature--ride',w1:'.works .work:nth-child(1)',w2:'.works .work:nth-child(2)',w3:'.works .work:nth-child(3)',w7:'.works .work:nth-child(6)',w8:'.works .work:nth-child(7)'}[card];
    var el=doc.querySelector(sel);el.classList.remove('reveal');
    el.querySelectorAll('img').forEach(function(i){i.removeAttribute('loading')});
    var pr=el.querySelector('[data-pr-state]');if(pr)pr.parentNode.innerHTML='PR #874 · <b>birleştirildi</b>';
    document.body.appendChild(el);
  });
}
</script></body></html>
