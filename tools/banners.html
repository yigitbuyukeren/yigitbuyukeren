<html lang="tr"><head><meta charset="utf-8"><title>Proje kapakları</title><style>
:root{--bg:#E8E9E3;--ink:#151719;--ink-2:#3C403A;--muted:#565A53;--rule:#C3C6BD;--accent:#E8420E;--plate:#DDDFD7;--shadow:0 30px 70px -30px rgba(0,0,0,.55);--f-display:"National Park",Georgia,"Times New Roman",serif;--f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Consolas,monospace;--f-text:Geist,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
:root[data-theme=dark]{--bg:#111214;--ink:#F1EDE3;--ink-2:#D8D4C9;--muted:#A7A399;--rule:#33343A;--accent:#FF5A1F;--plate:#1A1B1E;--shadow:0 30px 70px -30px rgba(0,0,0,.8)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text)}
body{min-width:1280px}
.flat .pb{border:0;border-radius:0}
.pb{position:relative;width:1280px;height:var(--h,520px);border:1px solid var(--rule);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:560px 1fr;background:var(--bg)}
.pb-text{padding:48px 20px 44px 56px;display:flex;flex-direction:column;gap:18px;z-index:2}
.pb-mark{display:flex;align-items:center;gap:10px;font:500 15px/1 var(--f-mono);color:var(--muted);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark-badge{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 13px/1 var(--f-display);letter-spacing:-.04em;flex:none}
.mark-badge i{font-style:normal;color:var(--accent)}
.pb-name{display:flex;flex-direction:column;align-items:flex-start;gap:18px;margin-top:auto}
.pb-icon{width:72px;height:72px;border-radius:19px;flex:none;box-shadow:var(--shadow);display:grid;place-items:center;font-size:40px;overflow:hidden;border:1px solid rgba(255,255,255,.14);color:#fff}
.icon-mark{font:700 30px/1 var(--f-display);letter-spacing:-.06em}
.pb h1{font-size:var(--fs,68px);max-width:480px;line-height:.95;letter-spacing:-.045em;font-weight:700;margin:0}
.pb .tagline{font:600 25px/1.3 var(--f-display);letter-spacing:-.02em;color:var(--ink-2);margin:0;max-width:20ch}
.pb .tagline em{font-style:normal;color:var(--accent)}
.tags{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
.tags li{font:500 14px/1 var(--f-mono);padding:8px 12px;border:1px solid var(--rule);border-radius:999px;color:var(--muted)}
.pb-flag{position:absolute;top:22px;right:24px;z-index:3;padding:7px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(17,18,20,.78);color:#F1EDE3;font:600 10px var(--f-mono);letter-spacing:.1em;line-height:1}
.pb-visual{position:relative;overflow:hidden;border-left:1px solid var(--rule)}
.frame{position:absolute;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);background:var(--plate)}
.frame img{width:100%;display:block}
.win-bar{height:30px;background:#E9E6DF;display:flex;align-items:center;gap:7px;padding:0 12px}
.win-bar i{width:11px;height:11px;border-radius:50%;background:#D4CFC4}
.win-bar i:nth-child(1){background:#F26B5E}.win-bar i:nth-child(2){background:#F5BE4F}.win-bar i:nth-child(3){background:#5FC454}
.win-bar span{margin-left:10px;font:500 12px/1 var(--f-mono);color:#6B675B}
:root[data-theme=dark] .win-bar{background:#26241F}:root[data-theme=dark] .win-bar span{color:#9A9585}
.phones{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phone{width:196px;height:392px;border-radius:30px;background:#F6F5EF;border:7px solid #111;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);overflow:hidden;color:#1A1B1E;flex:none;position:relative}
.phone:nth-child(1){transform:rotate(-6deg) translateX(18px)}
.phone:nth-child(2){transform:translateY(-14px);z-index:2}
.phone:nth-child(3){transform:rotate(6deg) translateX(-18px)}
.phone-top{height:32px;display:flex;align-items:center;justify-content:center;font:600 11px var(--f-mono);border-bottom:1px solid rgba(0,0,0,.08);background:#EFEEE6}
.phone-body{padding:16px 14px;display:grid;gap:10px}
.phone-kicker{font:600 9px var(--f-mono);letter-spacing:.1em;color:#6B675B}
.phone-big{font:700 26px/1 var(--f-display);letter-spacing:-.04em}
.phone-bar{height:8px;border-radius:999px;background:#E1DFD5;overflow:hidden}
.phone-bar i{display:block;height:100%;background:#2F6B4F;border-radius:inherit}
.phone-row{display:flex;justify-content:space-between;font:500 10px var(--f-mono);color:#565A53;border-top:1px solid rgba(0,0,0,.08);padding-top:8px}
.phone-row b{color:#1A1B1E}
.dash{position:absolute;left:44px;right:44px;top:50%;transform:translateY(-50%);border-radius:22px;background:rgba(9,14,28,.82);border:1px solid rgba(255,255,255,.16);box-shadow:0 34px 70px -32px rgba(0,0,0,.85);padding:22px}

.dash-nav{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.dash-arrow{font-size:38px;line-height:1;color:#FF8A5C}
.dash-nav b{display:block;font:700 26px/1 var(--f-display);letter-spacing:-.03em;color:#fff}
.dash-nav small{display:block;margin-top:7px;font:500 12px var(--f-mono);color:#9BB0D8}
.dash-bottom{display:flex;gap:8px;margin-top:14px}
.dash-bottom span{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:rgba(255,255,255,.05);font:500 11px var(--f-mono);color:#C9D4EA}
.veil{position:absolute;inset:0;display:grid;place-items:center;padding:40px}
.veil-card{width:540px;border-radius:22px;border:1px solid rgba(255,255,255,.16);background:rgba(9,10,14,.74);box-shadow:0 34px 70px -32px rgba(0,0,0,.9);padding:24px;display:grid;gap:16px}
.veil-head{display:flex;align-items:center;gap:12px}

.veil-title{display:block;margin-top:5px;font:700 23px/1 var(--f-display);letter-spacing:-.03em;color:#fff}
.veil-status{margin-left:auto;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,120,90,.4);background:rgba(255,90,31,.12);font:600 10px var(--f-mono);letter-spacing:.08em;color:#FFB4A8;white-space:nowrap}
.veil-rows{display:grid;gap:8px}
.veil-row{display:flex;justify-content:space-between;gap:16px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);font:500 12px var(--f-mono);color:#C9C5BC}
.veil-row b{color:#F1EDE3;text-align:right}
.veil-foot{font:500 11px/1.5 var(--f-mono);color:#9C97A8}
.archive{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:48px;color:currentColor}
.archive-emoji{font-size:70px;line-height:1}
.archive b{font:700 28px/1 var(--f-display);letter-spacing:-.03em}
.archive small{font:500 12px/1.4 var(--f-mono);letter-spacing:.06em;opacity:.72}
.badges{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,140px);grid-auto-rows:128px;gap:14px;justify-content:center;align-content:center}
.badge{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.badge span{font-size:44px;line-height:1}
.badge b{font:600 14px/1.2 var(--f-display);text-align:center;padding:0 8px;color:var(--ink-2)}
.screen{position:absolute;left:56px;top:60px;width:600px;border-radius:16px;overflow:hidden;background:var(--bg);border:1px solid var(--rule);box-shadow:0 30px 70px -30px rgba(0,0,0,.55)}
.screen-body{padding:20px 24px;display:grid;gap:4px}
.screen-kicker{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--muted);margin-bottom:6px}
.route-stop{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--rule);padding:9px 0 0;font:600 11px var(--f-mono);color:var(--muted)}
.route-stop b{font:700 20px var(--f-display);color:var(--ink);letter-spacing:-.02em}
.unknown{padding:40px;font:600 16px var(--f-mono);color:var(--ink)}
